version: '3.9'

services:
  postgres:
    profiles: [local-db]
    image: postgres:16-alpine
    container_name: doan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doan_local
      POSTGRES_USER: doan_local
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-}
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doan_local -d doan_local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doan_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: doan_backend
    command: ["pnpm", "dev"]
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - STORAGE_LOCAL_PATH=/app/uploads
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/backend/node_modules
      - /workspace/frontend/node_modules
      - /workspace/shared/node_modules
      - uploads_data:/app/uploads
    networks:
      - doan_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: doan_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:${PORT:-3000}/api
      - VITE_AUTH_API=true
      - VITE_TERM_API=true
      - VITE_CATALOG_API=true
      - VITE_IMPORT_API=true
      - VITE_REGISTRATION_API=true
      - VITE_DEMO_MODE=false
    ports:
      - '5173:5173'
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/backend/node_modules
      - /workspace/frontend/node_modules
      - /workspace/shared/node_modules
    networks:
      - doan_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: doan_mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI
    networks:
      - doan_network

  nginx:
    image: nginx:alpine
    container_name: doan_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '80:80'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - doan_network

volumes:
  postgres_data:
  uploads_data:

networks:
  doan_network:
    driver: bridge

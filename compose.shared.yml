# One integration server for the team; uses backend/.env, never a local DB fixture.
# Start explicitly: docker compose -p btl-shared -f compose.shared.yml up -d --build
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "dist/main"]
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      STORAGE_LOCAL_PATH: /app/uploads
      EMAIL_WORKER_ENABLED: "false"
    volumes:
      - shared_uploads:/app/uploads
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: /api
      VITE_AUTH_API: "true"
      VITE_TERM_API: "true"
      VITE_CATALOG_API: "true"
      VITE_IMPORT_API: "true"
      VITE_REGISTRATION_API: "true"
      VITE_DEMO_MODE: "false"
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "${TEAM_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
volumes:
  shared_uploads:

# Separate developer database only; never imports backend/.env.
services:
  team-postgres:
    image: postgres:17-alpine
    container_name: btl-team-local-postgres
    environment:
      POSTGRES_USER: btl_local
      POSTGRES_DB: btl_pr2b_dev
      POSTGRES_PASSWORD: ${TEAM_DB_PASSWORD:?Run pnpm db:local:init}
    labels:
      btl.team.instance: ${TEAM_DB_TOKEN:?Run pnpm db:local:init}
    ports:
      - '127.0.0.1:55440:5432'
    volumes:
      - team_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U btl_local -d btl_pr2b_dev']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  team_local_data:

name: Frontend CI

on:
  push:
    branches: [main, develop, fix/integration-ui]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-ci.yml'
      - 'scripts/check-production-assets*'
  pull_request:
    branches: [main, develop, fix/integration-ui]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-ci.yml'
      - 'scripts/check-production-assets*'
  workflow_dispatch:
jobs:
  build:
    name: Lint & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm type-check

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3000/api
          VITE_AUTH_API: 'true'
          VITE_DEMO_MODE: 'false'
        run: pnpm build

      - name: Run tests
        working-directory: frontend
        run: pnpm test

      - name: Reject test controls and credentials in production assets
        run: |
          node --test scripts/check-production-assets.test.cjs
          node scripts/check-production-assets.cjs --frontend frontend/dist

name: Backend CI

on:
  push:
    branches: [main, develop, fix/integration-ui]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-ci.yml'
      - 'scripts/check-production-assets*'
  pull_request:
    branches: [main, develop, fix/integration-ui]
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-ci.yml'
      - 'scripts/check-production-assets*'
  workflow_dispatch:
jobs:
  pr2b-review:
    name: PR2B review SQL on isolated PostgreSQL 17
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci
      DIRECT_URL: postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci
      PR2B_TEST_URL: postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci
      PGHOST: 127.0.0.1
      PGUSER: test_user
      PGPASSWORD: test_password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: btl_pr2b_ci
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - name: Prepare, validate and generate review clients
        working-directory: backend
        run: |
          pnpm prisma generate
          pnpm prisma validate
          pnpm pr2b:prepare
          pnpm pr2b:validate
          pnpm pr2b:generate
          pnpm type-check
          pnpm type-check:pr2b
          pnpm foundation:check
          python scripts/prepare-uc17-24.check.py
          pnpm pr2b:target-test
          pnpm test:local-tools
      - name: Rehearse review SQL over synthetic legacy data
        working-directory: backend
        run: pnpm pr2b:rehearse
      - name: Rehearse actual Prisma migration history in a separate empty DB
        working-directory: backend
        env:
          PR2B_TEST_URL: postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_chain
        run: |
          createdb btl_pr2b_ci_chain
          pnpm pr2b:replay-chain
      - name: Rehearse active repository migrations and canonical client
        working-directory: backend
        env:
          PR2B_TEST_URL: postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_active
        run: |
          createdb btl_pr2b_ci_active
          pnpm db:test:active-chain
          pnpm build
          node ../scripts/check-production-assets.cjs --backend dist
          pnpm test:smoke:local
      - name: Step 4 API and populated-baseline upgrade
        working-directory: backend
        run: |
          createdb btl_pr2b_ci_step4_api
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step4_api pnpm test:review-groups:api
          createdb btl_pr2b_ci_step4_upgrade
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step4_upgrade pnpm test:review-groups:upgrade
      - name: Step 5 API and populated-baseline upgrade
        working-directory: backend
        run: |
          createdb btl_pr2b_ci_step5_api
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step5_api pnpm test:proposal-reviews:api
          createdb btl_pr2b_ci_step5_upgrade
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step5_upgrade pnpm test:proposal-reviews:upgrade
      - name: Step 6 versions, resubmission and populated-baseline upgrade
        working-directory: backend
        run: |
          createdb btl_pr2b_ci_step6_api
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step6_api pnpm test:proposal-versions:api
          createdb btl_pr2b_ci_step6_lifecycle
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step6_lifecycle pnpm test:proposal-lifecycle:api
          createdb btl_pr2b_ci_step6_upgrade
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step6_upgrade pnpm test:proposal-versions:upgrade
      - name: Step 7 finalization, private PDF, receipt and migration upgrade
        working-directory: backend
        run: |
          createdb btl_pr2b_ci_step7_api
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step7_api pnpm test:proposal-dossiers:api
          createdb btl_pr2b_ci_step7_upgrade
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step7_upgrade pnpm test:proposal-dossiers:upgrade
      - name: Step 8A guidance plans, tasks, weekly obligations and migration upgrade
        working-directory: backend
        run: |
          createdb btl_pr2b_ci_step8a_api
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step8a_api pnpm test:guidance-tasks:api
          createdb btl_pr2b_ci_step8a_upgrade
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step8a_upgrade pnpm test:guidance-tasks:upgrade
      - name: Step 8B private uploads, immutable submissions and additive upgrade
        working-directory: backend
        run: |
          createdb btl_pr2b_ci_step8b_api
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step8b_api pnpm test:guidance-submissions:api
          createdb btl_pr2b_ci_step8b_upgrade
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step8b_upgrade pnpm test:guidance-submissions:upgrade
      - name: Step 8C reviews, meetings, scoped dashboard and whole 8A-8B-8C flow
        working-directory: backend
        run: |
          createdb btl_pr2b_ci_step8c_api
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step8c_api pnpm test:guidance-reviews:api
          createdb btl_pr2b_ci_step8c_upgrade
          PR2B_TEST_URL=postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_ci_step8c_upgrade pnpm test:guidance-reviews:upgrade
      - uses: actions/upload-artifact@v4
        with:
          name: pr2b-review-results
          path: |
            backend/prisma/review/pr2b/test-results.json
            backend/prisma/review/pr2b/chain-results.json
            backend/prisma/review/pr2b/active-chain-results.json
            backend/prisma/review/pr2b/smoke-results.json
            backend/prisma/review/step4-results.json
            backend/prisma/review/step4-upgrade-results.json
            backend/prisma/review/step5-results.json
            backend/prisma/review/step5-upgrade-results.json
            backend/prisma/review/step6-results.json
            backend/prisma/review/step6-lifecycle-results.json
            backend/prisma/review/step6-upgrade-results.json
            backend/prisma/review/step7-results.json
            backend/prisma/review/step7-upgrade-results.json
            backend/prisma/review/step7-sample.pdf
            backend/prisma/review/step7-long-sample.pdf
            backend/prisma/review/step8a-results.json
            backend/prisma/review/step8a-upgrade-results.json
            backend/prisma/review/step8b-results.json
            backend/prisma/review/step8b-upgrade-results.json
            backend/prisma/review/step8c-results.json
            backend/prisma/review/step8c-upgrade-results.json
  test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_unit_ci
      DIRECT_URL: postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_unit_ci

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: btl_pr2b_unit_ci
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: backend
        run: pnpm prisma generate

      - name: Test dedicated database tooling guards
        working-directory: backend
        run: |
          pnpm test:database-tools
          node ../scripts/check-release-source.cjs
          node --test ../scripts/check-release-source.test.cjs scripts/integration/rehearsal-baseline.check.cjs scripts/acceptance/runtime-safety.check.cjs scripts/web-readonly-preview.test.cjs
          node --test ../scripts/check-production-assets.test.cjs scripts/integration-rbac-plan.check.cjs

      - name: Verify RBAC release and rollback on a separate PostgreSQL 17 container
        working-directory: backend
        shell: bash
        run: |
          export RBAC_SQL_TEST_CONTAINER="datn-rbac-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --name "$RBAC_SQL_TEST_CONTAINER" --label datn.rbac-test=true --tmpfs /var/lib/postgresql/data -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          trap 'docker rm -f "$RBAC_SQL_TEST_CONTAINER" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$RBAC_SQL_TEST_CONTAINER" pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec "$RBAC_SQL_TEST_CONTAINER" pg_isready -U postgres
          node scripts/integration-rbac-sql.check.cjs

      - name: Type check
        working-directory: backend
        run: pnpm type-check

      - name: Lint
        working-directory: backend
        run: pnpm lint

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_unit_ci
          PR2B_TEST_URL: postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_unit_ci
        run: |
          # Fresh academic roles must exist before UC17; never change applied SQL.
          node scripts/integration/deploy-test-chain-cli.cjs

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/btl_pr2b_unit_ci
          JWT_SECRET: ci-test-access-secret-not-for-production
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
          NODE_ENV: test
        run: pnpm test:cov

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          directory: backend/coverage

      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "code":
          "type": "string"
        "name":
          "type": "string"
        "createdAt":
          "type": "string"
          "format": "date-time"
      "required":
        - "id"
        - "code"
        - "name"
        - "createdAt"
    "ResearchAreaResponse":
      "type": "object"
      "additionalProperties": false
      "properties":
        "isActive":
          "type": "boolean"
        "id":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
        "description":
          "type": "string"
          "nullable": true
        "createdAt":
          "type": "string"
          "format": "date-time"
      "required":
        - "isActive"
        - "id"
        - "name"
        - "description"
        - "createdAt"
    "TitleResponse":
      "type": "object"

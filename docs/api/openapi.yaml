"info":
  "title": "QLDATN API"
  "description": "Hệ thống Quản lý Đồ án Tốt nghiệp"
  "version": "1.0"
  "contact": {}
"tags": []
"servers": []
"components":
  "securitySchemes":
    "bearer":
      "scheme": "bearer"
      "bearerFormat": "JWT"
      "type": "http"
  "schemas":
    "LoginInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "username":
          "type": "string"
        "password":
          "type": "string"
          "format": "password"
      "required":
        - "username"
        - "password"
    "ChangePasswordInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "oldPassword":
          "type": "string"
          "format": "password"
        "newPassword":
          "type": "string"
          "format": "password"
          "minLength": 8
          "maxLength": 128
      "required":
        - "oldPassword"
        - "newPassword"
    "ProfileInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
          "minLength": 3
        "email":
          "nullable": true
          "oneOf":
            -
              "type": "string"
              "format": "email"
            -
              "type": "string"
              "enum":
                - ""
          "description": "Trống/null giữ liên hệ hiện có."
        "phone":
          "type": "string"
      "required":
        - "name"
    "SemesterInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "academicYear":
          "type": "string"
          "pattern": "^\\d{4}-\\d{4}$"
          "example": "2026-2027"
        "semester":
          "type": "integer"
          "minimum": 1
          "maximum": 3
        "name":
          "type": "string"
        "startDate":
          "type": "string"
          "format": "date-time"
        "endDate":
          "type": "string"
          "format": "date-time"
      "required":
        - "academicYear"
        - "semester"
        - "startDate"
        - "endDate"
    "TermInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "code":
          "type": "string"
          "minLength": 3
          "maxLength": 80
        "name":
          "type": "string"
          "minLength": 5
          "maxLength": 250
        "semesterId":
          "type": "string"
          "format": "uuid"
        "trainingSystemId":
          "type": "string"
          "format": "uuid"
        "startDate":
          "type": "string"
          "format": "date-time"
        "endDate":
          "type": "string"
          "format": "date-time"
        "registrationStart":
          "type": "string"
          "format": "date-time"
        "registrationEnd":
          "type": "string"
          "format": "date-time"
      "required":
        - "code"
        - "name"
        - "semesterId"
        - "trainingSystemId"
        - "startDate"
        - "endDate"
    "TermPhaseInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "code":
          "type": "string"
          "enum":
            - "REGISTRATION"
            - "ASSIGNMENT"
            - "PROPOSAL"
            - "WEEKLY"
            - "FINAL"
            - "DEFENSE"
        "name":
          "type": "string"
        "start":
          "type": "string"
          "format": "date-time"
        "end":
          "type": "string"
          "format": "date-time"
        "locked":
          "type": "boolean"
      "required":
        - "code"
        - "name"
        - "start"
        - "end"
        - "locked"
    "TermRosterInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "studentIds":
          "type": "array"
          "items":
            "type": "string"
            "format": "uuid"
        "lecturers":
          "type": "array"
          "items":
            "type": "object"
            "additionalProperties": false
            "properties":
              "lecturerId":
                "type": "string"
                "format": "uuid"
              "quota":
                "type": "integer"
                "minimum": 0
                "maximum": 500
            "required":
              - "lecturerId"
              - "quota"
      "required":
        - "studentIds"
        - "lecturers"
    "StudentInput":
      "type": "object"
      "additionalProperties": true
      "properties":
        "studentCode":
          "type": "string"
          "example": "001234567"
        "fullName":
          "type": "string"
        "className":
          "type": "string"
        "cohort":
          "type": "string"
        "trainingSystemId":
          "type": "string"
          "format": "uuid"
        "gpa":
          "type": "number"
          "minimum": 0
          "maximum": 4
        "academicEligible":
          "type": "boolean"
        "email":
          "type": "string"
          "format": "email"
          "nullable": true
        "phone":
          "type": "string"
          "nullable": true
        "isActive":
          "type": "boolean"
      "required":
        - "studentCode"
        - "fullName"
        - "className"
        - "trainingSystemId"
        - "gpa"
    "LecturerInput":
      "type": "object"
      "additionalProperties": true
      "properties":
        "lecturerCode":
          "type": "string"
        "fullName":
          "type": "string"
        "departmentId":
          "type": "string"
          "format": "uuid"
        "titleId":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "email":
          "type": "string"
          "format": "email"
          "nullable": true
        "phone":
          "type": "string"
          "nullable": true
        "maxStudents":
          "type": "integer"
          "minimum": 0
          "maximum": 100
        "researchAreaIds":
          "type": "array"
          "items":
            "type": "string"
            "format": "uuid"
          "minItems": 1
        "isActive":
          "type": "boolean"
      "required":
        - "lecturerCode"
        - "fullName"
        - "departmentId"
        - "researchAreaIds"
    "ImportConfirmInput":
      "type": "object"
      "additionalProperties": false
      "properties":
        "mode":
          "type": "string"
          "enum":
            - "STRICT"
            - "VALID_ONLY"
      "required":
        - "mode"
    "ApiError":
      "type": "object"
      "additionalProperties": false
      "properties":
        "success":
          "type": "boolean"
          "enum":
            - false
        "data":
          "nullable": true
        "error":
          "type": "object"
          "additionalProperties": false
          "properties":
            "code":
              "type": "string"
            "message":
              "type": "string"
            "fields":
              "type": "array"
              "items":
                "type": "object"
                "additionalProperties": false
                "properties":
                  "path":
                    "type": "string"
                  "message":
                    "type": "string"
                "required": []
            "details":
              "type": "object"
              "additionalProperties": true
          "required":
            - "code"
            - "message"
        "message":
          "type": "string"
        "timestamp":
          "type": "string"
          "format": "date-time"
        "path":
          "type": "string"
      "required":
        - "success"
        - "error"
        - "timestamp"
    "ApiResult":
      "type": "object"
      "properties":
        "success":
          "type": "boolean"
          "enum":
            - true
        "data": {}
        "message":
          "type": "string"
        "timestamp":
          "type": "string"
          "format": "date-time"
      "required":
        - "success"
        - "data"
        - "timestamp"
    "TermPatch":
      "type": "object"
      "additionalProperties": false
      "properties":
        "code":
          "type": "string"
          "minLength": 3
          "maxLength": 80
        "name":
          "type": "string"
          "minLength": 5
          "maxLength": 250
        "semesterId":
          "type": "string"
          "format": "uuid"
        "trainingSystemId":
          "type": "string"
          "format": "uuid"
        "startDate":
          "type": "string"
          "format": "date-time"
        "endDate":
          "type": "string"
          "format": "date-time"
        "registrationStart":
          "type": "string"
          "format": "date-time"
        "registrationEnd":
          "type": "string"
          "format": "date-time"
      "required": []
    "StudentPatch":
      "type": "object"
      "additionalProperties": true
      "properties":
        "studentCode":
          "type": "string"
          "example": "001234567"
        "fullName":
          "type": "string"
        "className":
          "type": "string"
        "cohort":
          "type": "string"
        "trainingSystemId":
          "type": "string"
          "format": "uuid"
        "gpa":
          "type": "number"
          "minimum": 0
          "maximum": 4
        "academicEligible":
          "type": "boolean"
        "email":
          "type": "string"
          "format": "email"
          "nullable": true
        "phone":
          "type": "string"
          "nullable": true
        "isActive":
          "type": "boolean"
      "required": []
    "LecturerPatch":
      "type": "object"
      "additionalProperties": true
      "properties":
        "lecturerCode":
          "type": "string"
        "fullName":
          "type": "string"
        "departmentId":
          "type": "string"
          "format": "uuid"
        "titleId":
          "type": "string"
          "format": "uuid"
          "nullable": true
        "email":
          "type": "string"
          "format": "email"
          "nullable": true
        "phone":
          "type": "string"
          "nullable": true
        "maxStudents":
          "type": "integer"
          "minimum": 0
          "maximum": 100
        "researchAreaIds":
          "type": "array"
          "items":
            "type": "string"
            "format": "uuid"
          "minItems": 1
        "isActive":
          "type": "boolean"
      "required": []
    "SafeStudentSummary":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "code":
          "type": "string"
          "description": "Mã sinh viên là chuỗi, giữ số 0 đầu."
        "name":
          "type": "string"
        "className":
          "type": "string"
        "cohort":
          "type": "string"
        "program":
          "type": "string"
        "trainingSystemId":
          "type": "string"
          "format": "uuid"
        "gpa":
          "type": "number"
          "minimum": 0
          "maximum": 4
          "nullable": true
        "phone":
          "type": "string"
        "email":
          "type": "string"
        "eligible":
          "type": "boolean"
      "required":
        - "id"
        - "code"
        - "name"
        - "className"
        - "cohort"
        - "program"
        - "trainingSystemId"
        - "gpa"
        - "phone"
        - "email"
        - "eligible"
    "SafeLecturerSummary":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "code":
          "type": "string"
        "name":
          "type": "string"
        "departmentId":
          "type": "string"
          "format": "uuid"
        "directionIds":
          "type": "array"
          "items":
            "type": "string"
            "format": "uuid"
        "quota":
          "type": "integer"
          "minimum": 0
        "email":
          "type": "string"
        "phone":
          "type": "string"
      "required":
        - "id"
        - "code"
        - "name"
        - "departmentId"
        - "directionIds"
        - "quota"
        - "email"
        - "phone"
    "SafeAccount":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "username":
          "type": "string"
        "name":
          "type": "string"
        "email":
          "type": "string"
          "format": "email"
          "nullable": true
        "phone":
          "type": "string"
        "roles":
          "type": "array"
          "items":
            "type": "string"
            "enum":
              - "ADMIN"
              - "FACULTY"
              - "LECTURER"
              - "STUDENT"
              - "COMMITTEE"
        "permissions":
          "type": "array"
          "items":
            "type": "string"
            "example": "term:read"
        "mustChangePassword":
          "type": "boolean"
        "profileComplete":
          "type": "boolean"
        "locked":
          "type": "boolean"
        "studentId":
          "type": "string"
          "format": "uuid"
        "lecturerId":
          "type": "string"
          "format": "uuid"
        "student":
          "$ref": "#/components/schemas/SafeStudentSummary"
        "lecturer":
          "$ref": "#/components/schemas/SafeLecturerSummary"
      "required":
        - "id"
        - "username"
        - "name"
        - "email"
        - "phone"
        - "roles"
        - "permissions"
        - "mustChangePassword"
        - "locked"
      "description": "Tài khoản công khai từ accountDto. Không chứa password, passwordHash, refresh-token hash hoặc dữ liệu phiên nội bộ. Các liên kết student/lecturer chỉ có khi tài khoản có hồ sơ tương ứng."
    "LoginResponse":
      "type": "object"
      "additionalProperties": false
      "properties":
        "accessToken":
          "type": "string"
        "refreshToken":
          "type": "string"
        "user":
          "$ref": "#/components/schemas/SafeAccount"
      "required":
        - "accessToken"
        - "refreshToken"
        - "user"
    "RefreshResponse":
      "type": "object"
      "additionalProperties": false
      "properties":
        "accessToken":
          "type": "string"
        "user":
          "$ref": "#/components/schemas/SafeAccount"
      "required":
        - "accessToken"
        - "user"
    "LogoutResponse":
      "type": "object"
      "additionalProperties": false
      "properties":
        "loggedOut":
          "type": "boolean"
          "enum":
            - true
      "required":
        - "loggedOut"
    "CatalogLookupResponse":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "code":
          "type": "string"
        "name":
          "type": "string"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
      "required":
        - "id"
        - "code"
        - "name"
        - "createdAt"
    "DepartmentResponse":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "code":
          "type": "string"
        "name":
          "type": "string"
        "createdAt":
          "type": "string"
          "format": "date-time"
        "updatedAt":
          "type": "string"
          "format": "date-time"
      "required":
        - "id"
        - "code"
        - "name"
        - "createdAt"
        - "updatedAt"
    "TrainingSystemResponse":
      "type": "object"
